<script>window.pyodideReady = import("https://cdn.jsdelivr.net/pyodide/v0.26.4/full/pyodide.mjs");function toggleMenu(){const m=document.getElementById("menuBox");m.style.display=m.style.display==="none"?"block":"none";}
async function openPackages(){
  const choice = await new Promise(resolve => {
    const box = document.createElement("div");
    box.style.cssText =
      "position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;z-index:9999;";

    box.innerHTML = `
      <div style="background:#222;color:white;padding:25px;border-radius:16px;text-align:center;min-width:280px;">
        <h2>📦 Package Manager</h2>
        <p>Select package manager</p>
        <button id="npmBtn" style="padding:12px 25px;margin:8px;font-size:16px;">npm</button>
        <button id="pipBtn" style="padding:12px 25px;margin:8px;font-size:16px;">pip</button>
      </div>
    `;

    document.body.appendChild(box);

    box.querySelector("#npmBtn").onclick = () => {
      box.remove();
      resolve("npm");
    };

    box.querySelector("#pipBtn").onclick = () => {
      box.remove();
      resolve("pip");
    };
  });

  const endpoint = choice === "npm"
    ? "/api/install-npm"
    : "/api/install-pip";

  const packageName = prompt(
    "Enter " + (choice === "npm" ? "npm" : "Python") + " package name:"
  );

  if(!packageName || !packageName.trim()) return;

  try{
    const response = await fetch(endpoint,{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({package:packageName.trim()})
    });

    const data = await response.json();

    if(data.success){
      alert("Package installed successfully!\n\n" +
            packageName.trim() + "\n\n" +
            data.output);
    }else{
      alert("Package installation failed.\n\n" +
            (data.error || "Unknown error"));
    }
  }catch(error){
    alert("Connection error.\n\n" + error.message);
  }
}
if(localStorage.getItem("selectedLanguage"))document.getElementById("settingsLanguage").value=localStorage.getItem("selectedLanguage");
if(localStorage.getItem("selectedProvider"))document.getElementById("settingsProvider").value=localStorage.getItem("selectedProvider");
function applySettings(){
  const lang=document.getElementById("settingsLanguage").value;
  const prov=document.getElementById("settingsProvider").value;
  localStorage.setItem("selectedLanguage",lang);
  localStorage.setItem("selectedProvider",prov);

  const theme=document.getElementById("settingsTheme").value;
  document.body.classList.toggle("lightTheme",theme==="light");
  localStorage.setItem("theme",theme);
  document.getElementById("settingsPanel").style.display="none";
}
function openSettings(){document.getElementById("settingsPanel").style.display="block";}
function saveCurrentFile(){const code=document.getElementById("code").value;const blob=new Blob([code],{type:"text/plain"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=window.currentFileName||"ProgrammingAI_Code.txt";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);}
function toggleTheme(){document.body.classList.toggle("lightTheme");localStorage.setItem("theme",document.body.classList.contains("lightTheme")?"light":"dark");} if(localStorage.getItem("theme")==="light"){document.body.classList.add("lightTheme");}
function loadFiles(event){
  const files=event.target.files;
  const list=document.getElementById("fileList");
  list.style.display="block";
  list.innerHTML="";
  window.uploadedFiles=Array.from(files);
  window.uploadedFiles.forEach((file,i)=>{
    const btn=document.createElement("button");
    btn.textContent="📄 "+file.name;
    btn.style.display="block";
    btn.style.width="100%";
    btn.style.marginBottom="5px";
    btn.onclick=()=>openFile(i);
    list.appendChild(btn);
  });
}
function openFile(index){
  const file=window.uploadedFiles[index];
  const reader=new FileReader();
  reader.onload=()=>{document.getElementById("code").value=reader.result;};
    window.currentFileName=file.name;
  reader.readAsText(file);
}
</script>

let aiChatHistory=[];
localStorage.removeItem("aiChatHistory");

async function sendAIChat(){
  const input=document.getElementById("aiChatInput");
  const messages=document.getElementById("aiChatMessages");
  const text=input.value.trim();

  if(!text) return;

  messages.innerHTML += "<div><b>You:</b> "+text.replace(/</g,"&lt;")+"</div>";
  input.value="";
  messages.innerHTML += "<div id='aiTyping'><b>AI:</b> Thinking...</div>";
  messages.scrollTop=messages.scrollHeight;

  try{
    console.log("Sending AI request:", text);
    const response=await fetch("/api/ai-chat",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        message:text,
        code:document.getElementById("code").value,
        provider:localStorage.getItem("selectedProvider") || "local",
            history:aiChatHistory
      })
    });

    const data=await response.json();
    document.getElementById("aiTyping")?.remove();

    if(data.success){
      aiChatHistory.push({role:"user",content:text});
      aiChatHistory.push({role:"assistant",content:data.answer || ""}); localStorage.setItem("aiChatHistory",JSON.stringify(aiChatHistory));
      const answer=data.answer || ""; const codeMatch=answer.match(/<CODE>([\s\S]*?)<\/CODE>/i); const userAskedForCode=/\b(fix|change|add|remove|modify|edit|update|rewrite|correct|debug|replace|delete|generate|create|write)\b.*\b(code|coding|program|programming|function|class|script|html|css|javascript|python|java|c\+\+)\b|\b(code|coding|program|programming|function|class|script|html|css|javascript|python|java|c\+\+)\b.*\b(fix|change|add|remove|modify|edit|update|rewrite|correct|debug|replace|delete|generate|create|write)\b/i.test(text); if(codeMatch && userAskedForCode){document.getElementById("code").value=codeMatch[1].trim(); messages.innerHTML += "<div><b>AI:</b> ✅ Code updated in Coding screen.</div>";}else{messages.innerHTML += "<div><b>AI:</b> "+answer.replace(/</g,"&lt;").replace(/\n/g,"<br>")+"</div>";} 
   }else{
      messages.innerHTML += "<div><b>AI:</b> ❌ "+(data.message || "AI error")+"</div>";
    }
  }catch(error){
    document.getElementById("aiTyping")?.remove();
    messages.innerHTML += "<div><b>AI:</b> ❌ "+error.message+"</div>";
  }

  messages.scrollTop=messages.scrollHeight;
}

function getSelectedLanguage(){const code=document.getElementById("code").value; if(/console\.log|let |const |var |=>/.test(code)) return "javascript"; if(/print\(|def |import /.test(code)) return "python"; return "javascript";}
async function fixCode(){
  const code = document.getElementById("code").value;
  const output = document.getElementById("output");

  const error = output.textContent;

  if(!error || error === "Ready..." || error === "Running..."){
    output.textContent = "❌ First run the code and get an error.";
    return;
  }

  output.textContent = "🤖 AI fixing code...";

  try{
    const response = await fetch("/api/ai-chat",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        message:"Fix this coding error using the code below. Return ONLY the COMPLETE corrected code inside <CODE>...</CODE>. Do not explain.\n\nCURRENT CODE:\n"+code+"\n\nERROR:\n"+error,
        code:code,
        provider:localStorage.getItem("selectedProvider") || "openrouter",
        history:[]
      })
    });

    const data = await response.json();
    const answer = data.answer || "";
    const codeTag = answer.match(/<CODE>([\s\S]*?)<\/CODE>/i);
    const codeBlock = answer.match(/```(?:python|javascript|js|java|c|cpp|go|rust|php|ruby|kotlin|typescript|csharp|cs)?\s*([\s\S]*?)```/i);
    const match = codeTag || codeBlock;

    if(match){
      document.getElementById("code").value = match[1].trim();
      output.textContent = "✅ AI fixed the code. Running..."; setTimeout(()=>runCode(),100);
    }else{
      output.textContent = "❌ AI response:\n" + answer;
    }
  }catch(e){
    output.textContent = "❌ AI error: " + e.message;
  }
}
async function runCode(){

      catch(e){ output.textContent="❌ "+e.message; setTimeout(()=>fixCode(),100); }

      return;
